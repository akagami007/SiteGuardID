version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: siteguard_postgis
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siteguard
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
